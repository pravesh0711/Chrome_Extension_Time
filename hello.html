<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Converter</title>
   <style>
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: stretch;
            border-radius: 9px;
            background-color: #452c63;
            height: 100%;
            padding: 24px;
            gap: 9px;
            height: 380px;
            width: 424px;
        }

        .flex-container > div{
            background: #7B68EE;
            border: 7px solid #E6E6FA;
            border-radius: 9px;
            padding: 14px;
            height: 48px;
            width: 350px;
            color: white;
           font: italic small-caps bold 16px/2 cursive;   
        }
        .heading{
            align-items: center;
        }
        button {
        background-color: #ce1919;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        }

        button:hover {
        background-color: #0056b3;
        }

</style>

</head>

<body>
    <h1 class="heading">Time Zone</h1>
    <div class="flex-container">
        <div class="item1">
            <div id = "ISTtime"></div>
        </div>
        <div class="item2">
            <div id="ESTtime"></div>
        </div>
        <div class="item3" style="height: 135px;">
            <label for="istDateTime">IST to EST converter </label><br>
            <label>Enter IST time and Date</label><br>
            <input type="datetime-local" id="istDateTime" required />
            <button onclick="convertTime()">Convert</button>
            <div id="result"></div> 
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
