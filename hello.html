<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            /* flex-flow: column wrap; */
            flex-direction: column;
            flex-wrap: wrap;
            align-content: stretch;
            border-radius: 9px;
            background-color: #452c63;
            height: 100%;
            padding: 24px;
            gap: 9px;
            height: 200px;
            width: 424px;
        }

        .flex-container > div{
            /* background: #; */
            background: #7B68EE;
            border: 7px solid #E6E6FA;
            border-radius: 9px;
            padding: 14px;
            height: 48px;
            width: 350px;
            color: white;
           font: italic small-caps bold 16px/2 cursive;   

        }
        .heading{
            align-items: center;
        }

</style>

</head>

<body>
    <h1 class="heading">Time Zone</h1>
    <div class="flex-container">
        <div class="item1">
            <div id = "ISTtime"></div>
        </div>
        <div class="item2">
            <div id="ESTtime"></div>
        </div>
        
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
