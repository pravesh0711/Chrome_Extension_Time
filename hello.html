   <style>
        .flex-container {

            display: flex;
            justify-content: space-around; 
            align-items: stretch; 
            /* flex-flow: column wrap; */ 
            flex-direction: column; 
            flex-wrap: wrap; 
            align-content: stretch;
            background-color: #bbdefb;
            height: 100%;
            padding: 15px;
            gap: 5px;

        }

        .flex-container > div{
            background: #ffecb3;
            border: 3px solid #ffcc80;
            border-radius: 5px;
            padding: 8px;
        }

</style>

</head>
